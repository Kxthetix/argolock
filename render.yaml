services:
  # ─── Redis (Broker & Result Backend) ────────────────────────────────────────
  - type: redis
    name: argolock-redis
    ipAllowList: [] # Private network only (highly secure)

  # ─── FastAPI Backend API ────────────────────────────────────────────────────
  - type: web
    name: argolock-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: MONGODB_URL
        sync: false # Paste your MongoDB Atlas Connection String here
      - key: MONGODB_DB
        value: argolock
      - key: REDIS_URL
        fromService:
          type: redis
          name: argolock-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: argolock-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: argolock-redis
          property: connectionString
      - key: TOOL_EXECUTION_MODE
        value: subprocess # Render environment doesn't allow Docker-in-Docker
      - key: SAFE_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false # Optional: Paste your OpenAI API Key for AI report generation

  # ─── Celery Task Worker ─────────────────────────────────────────────────────
  - type: worker
    name: argolock-worker
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    dockerCommand: celery -A workers.celery_app worker --loglevel=info
    envVars:
      - key: MONGODB_URL
        sync: false # Same MongoDB Atlas connection string
      - key: MONGODB_DB
        value: argolock
      - key: REDIS_URL
        fromService:
          type: redis
          name: argolock-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: argolock-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: argolock-redis
          property: connectionString
      - key: TOOL_EXECUTION_MODE
        value: subprocess
      - key: SAFE_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
