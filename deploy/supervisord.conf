; ==============================================================================
; ARGOLOCK NET — Production Supervisor Configuration
; Manages API Gateway, 3 Celery Worker Queues, and Pipeline Stall Watchdog
; ==============================================================================

[supervisord]
nodaemon=false
logfile=/var/log/argolock/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/argolock/supervisord.pid
user=argolock

[unix_http_server]
file=/var/run/argolock/supervisor.sock
chmod=0700
chown=argolock:argolock

[supervisorctl]
serverurl=unix:///var/run/argolock/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ─── 1. FastAPI Web Server ───────────────────────────────────────────────────
[program:argolock-api]
directory=/opt/argolock/backend
command=/opt/argolock/backend/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
user=argolock
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
killasgroup=true
stopasgroup=true
stdout_logfile=/var/log/argolock/api-out.log
stderr_logfile=/var/log/argolock/api-err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; ─── 2. Celery Recon Worker (Queue: recon, default) ──────────────────────────
[program:argolock-worker-recon]
directory=/opt/argolock/backend
command=/opt/argolock/backend/venv/bin/celery -A workers.celery_app worker -Q recon,default -c 2 --loglevel=info -n recon@%%h
user=argolock
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/var/log/argolock/worker-recon-out.log
stderr_logfile=/var/log/argolock/worker-recon-err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; ─── 3. Celery Scanner Worker (Queue: scanner) ──────────────────────────────
[program:argolock-worker-scanner]
directory=/opt/argolock/backend
command=/opt/argolock/backend/venv/bin/celery -A workers.celery_app worker -Q scanner -c 2 --loglevel=info -n scanner@%%h
user=argolock
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/var/log/argolock/worker-scanner-out.log
stderr_logfile=/var/log/argolock/worker-scanner-err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; ─── 4. Celery Exploit & AI Worker (Queues: exploit, ai) ────────────────────
[program:argolock-worker-exploit]
directory=/opt/argolock/backend
command=/opt/argolock/backend/venv/bin/celery -A workers.celery_app worker -Q ai,exploit -c 2 --loglevel=info -n exploit@%%h
user=argolock
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
killasgroup=true
stopasgroup=true
stdout_logfile=/var/log/argolock/worker-exploit-out.log
stderr_logfile=/var/log/argolock/worker-exploit-err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; ─── 5. Pipeline Stall Watchdog Daemon ───────────────────────────────────────
[program:argolock-watchdog]
directory=/opt/argolock/backend
command=/opt/argolock/backend/venv/bin/python -m workers.stall_watchdog
user=argolock
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
killasgroup=true
stopasgroup=true
stdout_logfile=/var/log/argolock/watchdog-out.log
stderr_logfile=/var/log/argolock/watchdog-err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
